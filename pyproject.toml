[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warden-ingestion"
version = "1.0.0"
description = "Project Warden Document Ingestion, PII Sanitization & Preprocessing Subsystem (Tier 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
    "numpy>=1.26.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/warden_ingestion"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "pii: marks tests verifying PII scrubbing and anonymization recall",
    "wal: marks tests verifying SQLite WAL mode and ledger idempotency",
    "integration: marks end-to-end integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
